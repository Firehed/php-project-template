# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    # Majors are deliberately left ungrouped so each gets its own reviewable PR.
    groups:
      composer-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep Github Actions up to date
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"

  # Service images in docker-compose.yml. Separate from "docker" above; the two
  # ecosystems do not read each other's files.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
